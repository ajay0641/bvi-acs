version: 1
indices:
  published-products-index:
    target: /published-products-index.json
    include:
      - /products/**
    properties:
      sku:
        select: head > meta[name="sku"]
        value: attribute(el, "content")
      last-modified:
        select: none
        value: >-
          parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
